name: Update Manifest

on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch upstream manifest
        run: curl -fsSL https://repo.jellyfin.org/files/plugin/manifest.json -o modules/jellyfin/system/jellyfin-stable-plugin-manifest.json

      - name: Commit and open PR if changed
        run: |
          MANIFEST="modules/jellyfin/system/jellyfin-stable-plugin-manifest.json"
          if git diff --exit-code -- "$MANIFEST"; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="update-manifest"
          git switch -C "$BRANCH"
          git add "$MANIFEST"
          git commit -m "chore: update manifests"
          git push --force-with-lease origin "$BRANCH"
          gh pr create \
            --title "chore: update manifests" \
            --body "Automated Jellyfin plugin manifest update." \
            --base main \
            --head "$BRANCH"
